homematic_hcu: hcu1-E461.local
homematic_token:
ssl_cert_path:
ssl_verify: false
plugin_id: de.schnellniclas.homematic-bridge
friendly_name:
  en: "Homematic HTTP Bridge"
  de: "Homematic HTTP Bridge"

# Loxone UDP Push (optional)
# Wenn miniserver_ip gesetzt ist, werden HmIP-State-Änderungen per UDP an den Miniserver gesendet.
# Variablennamen: hmip_<DEVICE_ID>_ch<N>_on / _dimLevel / _hue / ...
# In Loxone Config: Virtueller Eingang mit passendem UDP-Variablennamen anlegen.
loxone:
  miniserver_ip: # z.B. 192.168.1.100 (leer lassen = deaktiviert)
  udp_port: 7777
  resync_interval_seconds: 300 # 0 = nur Initialzustand und manuelle Synchronisation
  heartbeat_interval_seconds: 60 # bridge_heartbeat/bridge_hcuConnected; 0 = aus
  numeric_states: true   # windowOpen 0/1/2, smokeAlarm, controlModeManual, absenceActive, weatherConditionCode
  percent_values: true   # zusätzlich <feld>Pct 0..100 für dimLevel, shutterLevel, slatsLevel, valvePosition, saturationLevel
  aggregates: true       # hmip_home_deviceCount/unreachCount/lowBatCount/sabotageCount
  command_feedback: true # nach Steuerbefehlen hmip_<ID>_lastCmdOk 0/1 und _lastCmdCode (HTTP-Status)
  # Auswahl, was gesendet wird (alles optional; leer = alles). Wirkt auch auf /api/loxone/mapping (sent).
  filter:
    groups: true         # Gruppenwerte (hmip_group_*) senden
    diagnostics: true    # rssiDeviceValue, dutyCycle, configPending je Gerät/Gruppe
    include_fields: []   # z.B. [on, windowOpen, smokeAlarm, actualTemperature, available]
    exclude_fields: []
    include_rooms: []    # Raumnamen wie in der HmIP-App
    exclude_rooms: []
    include_devices: []  # Geräte-IDs oder Labels
    exclude_devices: []

# Nur-Lese-Key für MCP/Auswertungen (kann nichts schalten). Ohne Angabe wird
# data/api_key_readonly.txt automatisch erzeugt. Alternativ ENV BRIDGE_API_KEY_READONLY.
# api_key_readonly:

# Steuerbefehle nur von diesen Adressen/Netzen annehmen (leer = alle).
# Lesende Endpunkte sind davon nicht betroffen. Hinter einem Reverse-Proxy sieht
# die Bridge die Proxy-Adresse.
control_allowed_ips: [] # z.B. ["192.168.2.20", "192.168.2.100"]  (Miniserver, eigener Rechner)

# Schutz vor Funküberlastung (HmIP Duty Cycle)
command_guard:
  dedupe_window_ms: 500          # identische Befehle innerhalb dieser Zeit verwerfen
  min_interval_ms: 150           # Abstand je Gerät/Gruppe; neuerer Befehl ersetzt wartenden
  duty_cycle_limit_percent: 80   # ab hier nur noch Alarm/Sirene; 0 = aus

# Optionale lokale Energiehistorie, nur vorhandene erreichbare Shelly-Zähler.
# Die Web-Auswahl unter /energy wird separat in config/energy.yaml gespeichert.
energy:
  enabled: false
  interval_seconds: 60
  retention_days: 90
  timezone: Europe/Berlin

# Shelly Netzwerk-Scanner (optional)
# Wenn enabled: true, erscheint unter /shelly eine Übersicht aller Shelly-Geräte im Netz.
# subnet: Das zu scannende Netzwerk (CIDR-Notation).
# timeout_sec: Timeout pro IP beim Sweep (kleiner = schneller, aber mehr Fehlalarme).
shelly:
  enabled: false
  subnet: "192.168.1.0/24"
  timeout_sec: 1.5
  username: admin       # optional: Benutzername für passwortgeschützte Shellys
  password:             # optional: Passwort (leer lassen wenn kein Passwort gesetzt)
  scan_on_startup: false  # Scan automatisch beim Start ausführen
  scan_interval_hours: 0  # Zyklischer Scan (0 = deaktiviert, z.B. 24 für täglich)

# HTTP-API Auth:
api_key: # optional: Key hier eintragen (oder leer lassen)
require_api_key: true
api_key_file: data/api_key.txt # Fallback-Datei; wird bei Bedarf automatisch erzeugt
