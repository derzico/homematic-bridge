{% extends "base.html" %}
{% block title %}Login – Homematic Bridge{% endblock %}

{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h7l-1 8 11-13h-7l1-7z"/></svg>
      Homematic <em style="color:var(--muted);font-style:normal;font-weight:500">Bridge</em>
    </div>
    {% if error %}
      <div class="login-error">Falsches Passwort. Bitte erneut versuchen.</div>
    {% endif %}
    <form method="POST" action="/login?next={{ next_url | e }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="login-field">
        <label>Passwort (API-Key)</label>
        <input type="password" name="password" autofocus autocomplete="current-password" placeholder="API-Key eingeben">
      </div>
      <button class="login-btn" type="submit">Anmelden</button>
    </form>
  </div>
</div>
{% endblock %}
