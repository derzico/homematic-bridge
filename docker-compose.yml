services:
  homematic-bridge:
    build: .
    container_name: homematic-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s
    environment:
      - TZ=Europe/Vienna
    volumes:
      # Directory mount allows atomic config updates; certificate stays read-only.
      - ./config:/app/config
      - ./config/hcu.crt:/app/config/hcu.crt:ro
      - ./data:/app/data
      - ./logs:/app/logs
